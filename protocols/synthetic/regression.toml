# Pinned to the committed synthetic fixture, so a clean checkout can run the
# complete workflow offline. Pinning is what makes a run a reproduction; a
# template that pins nothing is still auditable through its run bundle.
schema_version = 1
id = "synthetic.k_distance.linear.synthetic_kdist.v1"
task = "regression"
trainer = "linear_regression"

[dataset]
target = "k_distance"
target_contract = "synthetic.k_distance.v1"
target_units = "1/angstrom"
requires = ["features", "groups"]
record_id = "synthetic-kdist"
snapshot_version = "v1"
manifest_sha256 = "34d5f1e0a5e23e35a16a0743da72e3659a279961367b92803f3fc62a1e6a5e3b"

[split]
method = "group"
train = 0.7
validation = 0.1
calibration = 0.1
test = 0.1
seed = 42

[features]
schema = "tabular"

[model]
seed = 42

[model.parameters]
l2 = 1e-6

[evaluation]
primary_metric = "mae"
metrics = ["mae", "rmse", "r2"]
baseline = "train_median"
