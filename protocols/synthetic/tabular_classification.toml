# Synthetic classification protocol. Exercises stratified group splitting,
# validation-only threshold selection, and ranking metrics offline.
schema_version = 1
id = "synthetic-tabular-classification-v1"
task = "classification"
trainer = "logistic_regression"

[dataset]
record_id = "synthetic-tabular"
snapshot_version = "v1"
manifest_sha256 = "b43703860403bada8a7a07096692699a77313dc50df5625516794e55e11b55d4"
sample_id = "sample_id"
target = "target_class"

[split]
method = "group"
group_column = "structure_group_id"
stratify = true
train = 0.7
validation = 0.1
calibration = 0.1
test = 0.1
seed = 42

[features]
schema = "synthetic_tabular_xyz"
columns = ["x1", "x2", "x3"]

[model]
seed = 42

[model.parameters]
l2 = 1e-4
learning_rate = 0.2
iterations = 800

[evaluation]
primary_metric = "mcc"
metrics = ["accuracy", "balanced_accuracy", "precision", "recall", "f1", "mcc", "roc_auc", "pr_auc"]
baseline = "train_majority"
threshold_metric = "mcc"
positive_label = "metal"
