# QRF95-compatible k-distance quantile regression.
schema_version = 1
id = "k_points.k_distance.qrf.goldilocks_kdist_ultra.v1"
task = "regression"
trainer = "quantile_random_forest"

[dataset]
target = "k_distance"
target_contract = "goldilocks.k_distance.mesh_lower_bound.2pi.v1"
target_units = "1/angstrom"
requires = ["structures", "groups"]
record_id = "goldilocks-kdist-ultra"
snapshot_version = "75959-bwa52-legacy"
manifest_sha256 = "1221f0bec4b007172726ad3bc969f2349abb5a54d66ef2d823157290cb902066"

[split]
method = "group"
train = 0.7
validation = 0.1
calibration = 0.1
test = 0.1
seed = 42

[features]
schema = "comp_struct_soap_lattice_metal.v1"

[features.parameters]
batch_size = 32
soap = { r_cut = 10.0, n_max = 8, l_max = 6, sigma = 1.0 }

[features.depends_on.metallicity_checkpoint]
record_id = "ptc95-vbq12"
file = "is_metal.ckpt"
sha256 = "964d818de8a155e3219d1bff9f7fca12137a003c5c71ff6b4f1d68d472d4c9d1"

[features.depends_on.metallicity_atom_init]
record_id = "ptc95-vbq12"
file = "atom_init.json"
sha256 = "cb90bd2257dbf8cfc4e6b2b6d4348d4616e8e9680f1339b1461137032e0f1894"

[model]
seed = 42

[model.parameters]
n_estimators = 100
quantiles = [0.05, 0.5, 0.95]
n_jobs = -1

# Selected on validation by mean pinball loss over the three quantiles.
# min_samples_leaf governs how many training samples each leaf contributes to
# the empirical quantile, so it is the knob that decides interval quality; at
# the estimator default of 1 the 5% and 95% estimates come from roughly one
# value per tree.
[model.parameters.search]
min_samples_leaf = [1, 5, 20]

[evaluation]
primary_metric = "mae"
metrics = ["mae", "rmse", "r2"]
baseline = "train_median"
