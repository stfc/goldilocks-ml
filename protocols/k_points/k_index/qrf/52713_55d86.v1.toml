# CSLR quantile regression for the one-based k-index ladder.
schema_version = 1
id = "k_points.k_index.qrf.52713_55d86.v1"
task = "regression"
trainer = "quantile_random_forest"

[dataset]
target = "k_index"
target_contract = "goldilocks.k_index.ladder_1based.v2"
requires = ["structures", "groups"]
record_id = "52713-55d86"
snapshot_version = "v1"
manifest_sha256 = "5a6cffc002123f9d6f2f1f34be8622f32a6446b64f84c7e4d5601043392b4bea"

[split]
method = "group"
train = 0.7
validation = 0.1
calibration = 0.1
test = 0.1
seed = 42
stratify = false

[features]
schema = "cslr.v1"

[features.parameters]
batch_size = 128

[model]
seed = 42

[model.parameters]
n_estimators = 100
quantiles = [0.05, 0.5, 0.95]
n_jobs = -1
# Candidate values the model may publish. They are fitted alongside the
# interval quantiles, so choosing between them costs no extra fit.
decision_levels = [0.5, 0.6, 0.7, 0.75, 0.8, 0.85, 0.9, 0.95, 0.975, 0.99]

# Select interval smoothness on validation mean pinball loss. Calibration and
# test remain outside both fitting and selection.
[model.parameters.search]
min_samples_leaf = [1, 5, 20]

# A rung is acted on whole and the two directions of being wrong cost very
# different things: too low is an under-converged calculation, too high is
# machine time. Publishing one shared quantile (q0.6, the previous policy)
# means every structure pays whatever safety margin the hardest structures
# need, or the hardest structures get denied the accuracy the easy ones can
# keep -- no single level is both. Measured on q0.6: under-prediction reaches
# 76.7% for structures that truly need rung 12 or above, while the bulk of
# the dataset (rung < 7) already sits at 12.1% with room to spare.
#
# quantile_by_band publishes a different level per band of the model's own
# median instead of one shared level: each band searches decision_levels on
# its own validation subset and picks the cheapest level keeping ITS OWN
# under-prediction at or below the floor. A structure predicted easy does not
# pay for one predicted hard, and vice versa. The floor is 5%, not 25% (q0.6's
# global floor), because it is now enforced per band rather than on average --
# a global 25% average let the hardest band's failures hide behind the
# easiest band's successes.
[evaluation]
primary_metric = "mean_excess"
metrics = [
    "mean_excess",
    "underprediction_rate",
    "rounded_accuracy",
    "within_one",
    "mae",
    "rmse",
    "r2",
]
baseline = "train_median"
decision_metric = "mae"
decision_rule = "quantile_by_band"
max_underprediction = 0.05
# Reused as level bands, not offset bands: quantile_by_band picks a separate
# published level per band, cut on the model's own median (0.5, the one
# level every fit has regardless of policy) rather than on the value a band
# would publish -- so the cut does not depend on the decision it feeds.
# [7, 12], same cut as coverage_bins below, for the same reason recorded
# there.
decision_bands = [7, 12]
# Cut on the true rung. A diagnostic, not a rule: the truth is the one thing
# missing when a prediction is served. [7, 12], not [6, 11]: rung 12 on this
# 1-based ladder is the same physical cut that rung 11 was on the 0-based one
# (see the screen protocol's 52713_55d86.v1.toml, which anchors the same cut
# for the same reason).
coverage_bins = [7, 12]
