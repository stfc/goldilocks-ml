# Pinned classification counterpart to synthetic-kdist.toml. Exercises stratified
# group splitting, validation-only threshold selection, and ranking metrics.
schema_version = 1
id = "synthetic-metallic-v1"
task = "classification"
trainer = "logistic_regression"

[dataset]
target = "is_metal"
requires = ["features", "groups"]
record_id = "synthetic-metallic"
snapshot_version = "v1"
manifest_sha256 = "dc0f113db827d74370f724914bbb48a4e9e0b502f83c8e4045b57e20d0e9e63e"

[split]
method = "group"
stratify = true
train = 0.7
validation = 0.1
calibration = 0.1
test = 0.1
seed = 42

[features]
schema = "tabular"

[model]
seed = 42

[model.parameters]
l2 = 1e-4
learning_rate = 0.2
iterations = 800

[evaluation]
primary_metric = "mcc"
metrics = ["accuracy", "balanced_accuracy", "precision", "recall", "f1", "mcc", "roc_auc", "pr_auc"]
baseline = "train_majority"
threshold_metric = "mcc"
positive_label = "metal"
