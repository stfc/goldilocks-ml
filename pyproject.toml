[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "goldilocks-ml"
version = "0.1.0"
description = "Train and publish the models that choose DFT settings for you"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [
    { name = "Alin-Marin Elena" },
    { name = "Junwen Yin" },
    { name = "Susmita Basak" },
    { name = "Jaehoon Cha" },
    { name = "Gilberto Teobaldi" },
]
maintainers = [{ name = "Junwen Yin" }]
keywords = [
    "density-functional-theory",
    "dft",
    "k-points",
    "machine-learning",
    "materials-science",
    "quantum-espresso",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "data-collections-api==0.1.0",
]

[project.optional-dependencies]
models = [
    "dscribe==2.1.2",
    "matminer==0.10.1",
    "numpy==2.5.2",
    "pymatgen==2026.5.4",
    "scikit-learn==1.7.2",
    "sklearn-quantile==0.1.1",
    "torch==2.13.0",
    "torch-geometric==2.8.0.post1",
]

[project.urls]
Homepage = "https://stfc.github.io/goldilocks-ml/"
Documentation = "https://stfc.github.io/goldilocks-ml/"
Repository = "https://github.com/stfc/goldilocks-ml"
Issues = "https://github.com/stfc/goldilocks-ml/issues"
Changelog = "https://github.com/stfc/goldilocks-ml/blob/main/CHANGELOG.md"

[project.scripts]
goldilocks-ml = "goldilocks_ml.console:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.13",
]
docs = [
    # Executing a notebook without it makes tqdm print a warning naming the
    # absolute path of the interpreter, which then ships in the cell output.
    "ipywidgets>=8.1",
    "mkdocs>=1.6.1",
    "mkdocs-jupyter>=0.26.3",
    "mkdocs-material>=9.7.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/goldilocks_ml"]

[tool.hatch.build.targets.wheel.force-include]
"protocols" = "goldilocks_ml/protocols"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
