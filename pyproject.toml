[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "goldilocks-ml"
version = "0.2.0"
description = "Train and publish the models that choose DFT settings for you"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [
    { name = "Alin-Marin Elena" },
    { name = "Junwen Yin" },
    { name = "Susmita Basak" },
    { name = "Jaehoon Cha" },
    { name = "Gilberto Teobaldi" },
]
maintainers = [{ name = "Junwen Yin" }]
keywords = [
    "density-functional-theory",
    "dft",
    "k-points",
    "machine-learning",
    "materials-science",
    "quantum-espresso",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "data-collections-api==0.1.0",
]

[project.optional-dependencies]
models = [
    "dscribe==2.1.2",
    "matminer==0.10.1",
    "numpy==2.5.2",
    "pymatgen==2026.5.4",
    "scikit-learn==1.7.2",
    "sklearn-quantile==0.1.1",
    # 2.10.0, not the previous 2.13.0: the lowest torch patched against
    # GHSA-63cw-57p8-fm3p / CVE-2026-24747 (torch.load(weights_only=True)
    # arbitrary code execution, fixed >=2.10.0 -- this package's own
    # inference.py loads every checkpoint with weights_only=True) that is
    # also within is_magnetic's manually-installed sphericart-torch==1.0.9
    # requirement (torch>=2.3,<2.12). Verified: full test suite green, and the
    # published is_metal/k_distance/k_index models produce identical
    # predictions to the 2.13.0 pin on real structures (2026-09-18).
    "torch==2.10.0",
    "torch-geometric==2.8.0.post1",
]
# No `magnetism` extra: `mace`, the package `is_magnetic`'s backbone actually
# imports, has no PyPI release (it's a research collaborator's fork -- see
# deposits/magnetism/is_magnetic/mace_mlp/VENDORING_TODO.md) and a package
# published to PyPI cannot declare a direct git/URL dependency in its own
# metadata, so there is no extra this project could publish that would ever
# make `pip install goldilocks-ml[magnetism]` actually work. Pretending
# otherwise (an extra that installs everything except the one dependency
# that matters) was worse than not having one. See "Use the is_magnetic
# classifier" in README.md for the manual install this needs instead.

[project.urls]
Homepage = "https://stfc.github.io/goldilocks-ml/"
Documentation = "https://stfc.github.io/goldilocks-ml/"
Repository = "https://github.com/stfc/goldilocks-ml"
Issues = "https://github.com/stfc/goldilocks-ml/issues"
Changelog = "https://github.com/stfc/goldilocks-ml/blob/main/CHANGELOG.md"

[project.scripts]
goldilocks-ml = "goldilocks_ml.console:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.13",
]
docs = [
    # Executing a notebook without it makes tqdm print a warning naming the
    # absolute path of the interpreter, which then ships in the cell output.
    "ipywidgets>=8.1",
    "mkdocs>=1.6.1",
    "mkdocs-jupyter>=0.26.3",
    "mkdocs-material>=9.7.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/goldilocks_ml"]

[tool.hatch.build.targets.wheel.force-include]
"protocols" = "goldilocks_ml/protocols"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
