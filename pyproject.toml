[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "goldilocks-ml"
version = "0.1.0"
description = "Training, evaluation, and model publication workflows for Goldilocks"
requires-python = ">=3.12"
dependencies = [
    "data-collections-api==0.1.0",
]

[project.scripts]
goldilocks-psdi = "goldilocks_ml.psdi:cli"
goldilocks-train = "goldilocks_ml.cli:cli"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.13",
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/goldilocks_ml"]

[tool.hatch.build.targets.wheel.force-include]
"protocols" = "goldilocks_ml/protocols"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
