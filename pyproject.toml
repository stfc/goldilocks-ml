[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "goldilocks-ml"
version = "0.1.0"
description = "Train and publish the models that choose DFT settings for you"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [
    { name = "Alin-Marin Elena" },
    { name = "Junwen Yin" },
    { name = "Susmita Basak" },
    { name = "Jaehoon Cha" },
    { name = "Gilberto Teobaldi" },
]
maintainers = [{ name = "Junwen Yin" }]
keywords = [
    "density-functional-theory",
    "dft",
    "k-points",
    "machine-learning",
    "materials-science",
    "quantum-espresso",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "data-collections-api==0.1.0",
]

[project.optional-dependencies]
models = [
    "dscribe==2.1.2",
    "matminer==0.10.1",
    "numpy==2.5.2",
    "pymatgen==2026.5.4",
    "scikit-learn==1.7.2",
    "sklearn-quantile==0.1.1",
    # 2.10.0, not the previous 2.13.0: the lowest torch patched against
    # GHSA-63cw-57p8-fm3p / CVE-2026-24747 (torch.load(weights_only=True)
    # arbitrary code execution, fixed >=2.10.0 -- this package's own
    # inference.py loads every checkpoint with weights_only=True) that is
    # also within the magnetism extra's sphericart-torch==1.0.9 requirement
    # (torch>=2.3,<2.12). Verified: full test suite green, and the
    # published is_metal/k_distance/k_index models produce identical
    # predictions to the 2.13.0 pin on real structures (2026-09-18).
    "torch==2.10.0",
    "torch-geometric==2.8.0.post1",
]
# Heavier and less stable than `models`: the mace-torch fork this depends on
# has no PyPI release (see deposits/magnetism/is_magnetic/mace_mlp/), so
# it is kept out of `models`, which every other builtin needs to import.
# Additive on top of `models` for torch/numpy: install both extras together.
magnetism = [
    "ase==3.28.0",
    "e3nn==0.4.4",
    # 1.0.9, not 2.0.4: the training collaborator confirmed 1.0.2 as what
    # actually produced mace_matpes_pbe_baseline_run-3.model, and every
    # 1.x release keeps the same TorchScript custom-class registration
    # (`sphericart_torch.SolidHarmonics`) that checkpoint was pickled
    # against -- confirmed empirically, torch.load succeeds under 1.0.9
    # where it fails under 2.0.4. The 2.x line renames that registration
    # (see the superseded comment this replaces), so it can deserialize the
    # checkpoint's *numbers* but not the checkpoint's *pickle*. 1.0.9 is the
    # last 1.x release and the only one whose torch requirement
    # (>=2.3,<2.12) reaches up to the models extra's now-patched torch pin
    # above; earlier 1.x releases cap torch<2.8.
    "sphericart==1.0.9",
    "sphericart-torch==1.0.9",
    # TODO(magnetism-mirror): pin mace-torch to our own mirror of the commit
    # that actually produced mace_matpes_pbe_baseline_run-3.model, once that
    # mirror exists and the commit is confirmed (ac8ff476 vs 19cdf669 -- see
    # deposits/magnetism/is_magnetic/mace_mlp/VENDORING_TODO.md). For now,
    # install the local fork checkout in editable mode for development:
    #   uv pip install -e /path/to/1-magnetic-mace/mace
]

[project.urls]
Homepage = "https://stfc.github.io/goldilocks-ml/"
Documentation = "https://stfc.github.io/goldilocks-ml/"
Repository = "https://github.com/stfc/goldilocks-ml"
Issues = "https://github.com/stfc/goldilocks-ml/issues"
Changelog = "https://github.com/stfc/goldilocks-ml/blob/main/CHANGELOG.md"

[project.scripts]
goldilocks-ml = "goldilocks_ml.console:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.13",
]
docs = [
    # Executing a notebook without it makes tqdm print a warning naming the
    # absolute path of the interpreter, which then ships in the cell output.
    "ipywidgets>=8.1",
    "mkdocs>=1.6.1",
    "mkdocs-jupyter>=0.26.3",
    "mkdocs-material>=9.7.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/goldilocks_ml"]

[tool.hatch.build.targets.wheel.force-include]
"protocols" = "goldilocks_ml/protocols"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
