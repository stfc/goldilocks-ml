[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "goldilocks-ml"
version = "0.1.0"
description = "Training, evaluation, and model publication workflows for Goldilocks"
requires-python = ">=3.12"
dependencies = [
    "data-collections-api==0.1.0",
    "dscribe>=2.1.2",
    "matminer>=0.10.1",
    "pymatgen>=2026.5.4",
    "scikit-learn==1.7.2",
    "sklearn-quantile==0.1.1",
    "torch>=2.13.0",
    "torch-geometric>=2.8.0.post1",
]

[project.scripts]
goldilocks-psdi = "goldilocks_ml.psdi:cli"
goldilocks-train = "goldilocks_ml.cli:cli"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.13",
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/goldilocks_ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
