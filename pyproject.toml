[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "goldilocks-ml"
version = "0.1.0"
description = "Train and publish the models that choose DFT settings for you"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [
    { name = "Alin-Marin Elena" },
    { name = "Junwen Yin" },
    { name = "Susmita Basak" },
    { name = "Jaehoon Cha" },
    { name = "Gilberto Teobaldi" },
]
maintainers = [{ name = "Junwen Yin" }]
keywords = [
    "density-functional-theory",
    "dft",
    "k-points",
    "machine-learning",
    "materials-science",
    "quantum-espresso",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "data-collections-api==0.1.0",
]

[project.optional-dependencies]
models = [
    "dscribe==2.1.2",
    "matminer==0.10.1",
    "numpy==2.5.2",
    "pymatgen==2026.5.4",
    "scikit-learn==1.7.2",
    "sklearn-quantile==0.1.1",
    "torch==2.13.0",
    "torch-geometric==2.8.0.post1",
]
# Heavier and less stable than `models`: the mace-torch fork this depends on
# has no PyPI release (see deposits/magnetism/is_magnetic/mace_mlp/), so
# it is kept out of `models`, which every other builtin needs to import.
# Additive on top of `models` for torch/numpy: install both extras together.
magnetism = [
    "ase==3.28.0",
    "e3nn==0.4.4",
    # The training collaborator confirmed 1.0.2 as what actually produced
    # mace_matpes_pbe_baseline_run-3.model, but 1.0.2 caps torch<2.8, which
    # conflicts with the models extra's torch==2.13.0. 2.0.4 is a major
    # version bump (torch.compile/SYCL/CuPy/gpulite backend rework) but
    # verified numerically identical to 1.0.2 for SphericalHarmonics and
    # SolidHarmonics (the class the mace fork actually uses) on CPU float64,
    # values bit-exact and gradients within ~1e-11 (float64 summation-order
    # noise, not an algorithmic difference) -- see the goldilocks-ml PR that
    # made this change for the comparison script.
    "sphericart==2.0.4",
    "sphericart-torch==2.0.4",
    # TODO(magnetism-mirror): pin mace-torch to our own mirror of the commit
    # that actually produced mace_matpes_pbe_baseline_run-3.model, once that
    # mirror exists and the commit is confirmed (ac8ff476 vs 19cdf669 -- see
    # deposits/magnetism/is_magnetic/mace_mlp/VENDORING_TODO.md). For now,
    # install the local fork checkout in editable mode for development:
    #   uv pip install -e /path/to/1-magnetic-mace/mace
]

[project.urls]
Homepage = "https://stfc.github.io/goldilocks-ml/"
Documentation = "https://stfc.github.io/goldilocks-ml/"
Repository = "https://github.com/stfc/goldilocks-ml"
Issues = "https://github.com/stfc/goldilocks-ml/issues"
Changelog = "https://github.com/stfc/goldilocks-ml/blob/main/CHANGELOG.md"

[project.scripts]
goldilocks-ml = "goldilocks_ml.console:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.13",
]
docs = [
    # Executing a notebook without it makes tqdm print a warning naming the
    # absolute path of the interpreter, which then ships in the cell output.
    "ipywidgets>=8.1",
    "mkdocs>=1.6.1",
    "mkdocs-jupyter>=0.26.3",
    "mkdocs-material>=9.7.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/goldilocks_ml"]

[tool.hatch.build.targets.wheel.force-include]
"protocols" = "goldilocks_ml/protocols"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
