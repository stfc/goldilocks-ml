# Crystal graph convolutional network for binary metallicity.
#
# The trainer this protocol names is not implemented yet; see README.md for the
# training method it must reproduce.
schema_version = 1
id = "metallicity-cgcnn-v1"
task = "classification"
trainer = "cgcnn"

[dataset]
target = "is_metal"
requires = ["structures", "groups"]

[split]
method = "group"
stratify = true
train = 0.7
validation = 0.1
calibration = 0.1
test = 0.1
seed = 42

[features]
schema = "cgcnn_graph"

[features.parameters]
atom_embedding = "atom_init.json"
radius = 10.0
max_neighbors = 12
graph_type = "radius"

[model]
seed = 42

[model.parameters]
n_conv = 5
h_fea_len = 128
atom_fea_len = 64
orig_atom_fea_len = 92
n_h = 2
epochs = 300
patience = 50
batch_size = 128
learning_rate = 0.005
weight_decay = 0.0001
optimizer = "adamw"
scheduler = "onecycle"
loss = "CrossEntropyLoss"

[evaluation]
primary_metric = "mcc"
metrics = ["accuracy", "balanced_accuracy", "precision", "recall", "f1", "mcc", "roc_auc", "pr_auc"]
baseline = "train_majority"
threshold_metric = "mcc"
positive_label = "metal"
