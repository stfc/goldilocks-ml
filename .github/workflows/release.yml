name: Release

# Publishing is driven by a tag, so what reaches PyPI is always a commit that
# exists in the history rather than whatever a workstation happened to hold.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"

      # A tag that disagrees with the version in pyproject.toml would publish a
      # release nobody can find from the history.
      - name: Check the tag matches the packaged version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          packaged=$(uv run --frozen --no-project python -c \
            "import tomllib,pathlib;print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          tagged="${GITHUB_REF_NAME#v}"
          if [ "$packaged" != "$tagged" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $packaged"
            exit 1
          fi

      - name: Build
        run: uv build

      - name: Check the artifacts are well formed
        run: uvx twine check --strict dist/*

      - name: Upload the artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Trusted Publishing: PyPI verifies this workflow's identity, so there is
    # no API token to store or rotate. Configure the publisher once on PyPI
    # under the project's Publishing settings.
    environment:
      name: pypi
      url: https://pypi.org/p/goldilocks-ml
    permissions:
      id-token: write
    steps:
      - name: Download the artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
