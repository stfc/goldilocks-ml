site_name: Goldilocks ML
site_description: Reproducible model publication workflows for Goldilocks
site_url: https://stfc.github.io/goldilocks-ml/
repo_url: https://github.com/stfc/goldilocks-ml
repo_name: stfc/goldilocks-ml

theme:
  name: material
  features:
    - content.code.copy
    - navigation.footer
    - navigation.sections
    - navigation.top
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/weather-night
        name: Use dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Use light mode

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true

nav:
  - Home: index.md
  - Install: installation.md
  - Train a model:
      - Overview: training/index.md
      - Prepare your data: training/your-data.md
      - Configuration reference: training/protocol.md
      - What a run produces: training/run-bundle.md
      - Models:
          - QRF95 k-mesh: training/kmesh/qrf95.md
          - CGCNN metallicity: training/metallicity/cgcnn2.md
  - Publish a model: publishing.md
  - Reference:
      - Inference API: inference.md
      - CLI: cli-reference.md
      - Deposit format: deposit-format.md
      - Troubleshooting: troubleshooting.md
