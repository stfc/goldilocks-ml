site_name: Goldilocks ML
site_description: Reproducible model publication workflows for Goldilocks
site_url: https://stfc.github.io/goldilocks-ml/
repo_url: https://github.com/stfc/goldilocks-ml
repo_name: stfc/goldilocks-ml

theme:
  name: material
  features:
    - content.code.copy
    - navigation.footer
    - navigation.sections
    - navigation.top
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/weather-night
        name: Use dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Use light mode

plugins:
  - search
  - mkdocs-jupyter:
      # Model notebooks need the model, so they ship with their outputs
      # committed rather than being re-run on every build.
      execute: false
      include_source: true
      ignore_h1_titles: true

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true

nav:
  - Home: index.md
  - Install: installation.md
  - Train a model:
      - Overview: training/index.md
      - Prepare your data: training/your-data.md
      - Configuration reference: training/protocol.md
      - What a run produces: training/run-bundle.md
      - Models:
          - Overview: training/models/index.md
          - k-point mesh:
              - Overview: training/models/k_points/index.md
              - k-distance:
                  - QRF95 (historical): training/models/k_points/k_distance-qrf.md
                  - Notebook: notebooks/k_distance-qrf.ipynb
              - k-index: training/models/k_points/k_index.md
          - Metallicity:
              - Overview: training/models/metallicity/index.md
              - is-metal:
                  - CGCNN: training/models/metallicity/is_metal-cgcnn.md
                  - Notebook: notebooks/metallicity-cgcnn.ipynb
              - representation:
                  - CGCNN (historical): training/models/metallicity/representation-cgcnn.md
          - Magnetism: training/models/magnetism/index.md
          - Hubbard U: training/models/hubbard_u/index.md
  - Publish a model: publishing.md
  - Reference:
      - Inference API: inference.md
      - CLI: cli-reference.md
      - Deposit format: deposit-format.md
      - Troubleshooting: troubleshooting.md
